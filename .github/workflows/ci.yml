name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Node.js ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax check (lint)
        run: npm run lint

      - name: Validate schemas and templates
        run: npm run validate:schema

      - name: Test environment doctor
        run: node bin/flow.js doctor

      - name: Test CLI commands help
        run: |
          node bin/flow.js --help
          node bin/flow.js status --help
          node bin/flow.js project --help
          node bin/flow.js config --help
          node bin/flow.js scene --help
          node bin/flow.js run --help

      - name: Verify package bundle (npm pack dry-run)
        run: npm pack --dry-run
